name: PR Check

on:
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  check:
    name: Build Check
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore
      run: dotnet restore DegraChat.sln

    - name: Build
      run: dotnet build DegraChat.sln --configuration Release --no-restore

    - name: Check formatting
      run: dotnet format DegraChat.sln --verify-no-changes --severity warn
      continue-on-error: true
