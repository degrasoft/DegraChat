name: Build DegraChat

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_PATH: 'DegraChat.sln'

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build (Debug)
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Debug --no-restore

    - name: Build (Release)
      run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

  publish:
    name: Publish Windows Build
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Publish Win-x64
      run: |
        dotnet publish src/DegraChat.App/DegraChat.App.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:PublishTrimmed=true `
          -p:TrimMode=partial `
          --output ./publish/win-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: DegraChat-win-x64
        path: ./publish/win-x64/

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: ./publish/win-x64/DegraChat.App.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
